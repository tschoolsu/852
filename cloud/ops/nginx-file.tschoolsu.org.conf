server {
    listen 80;
    listen [::]:80;
    server_name file.tschoolsu.org;

    access_log /var/log/nginx/file.tschoolsu.org.access.log tpass_main;
    error_log /var/log/nginx/file.tschoolsu.org.error.log;
    client_max_body_size 110m;

    # The real_ip module retains the original network peer in $realip_remote_addr.
    # Reject direct connections, including forged CF-Connecting-IP headers.
    if ($tfiles_cloudflare_peer = 0) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
