server {
    listen 80;
    listen [::]:80;
    server_name file.tschoolsu.org;

    access_log /var/log/nginx/file.tschoolsu.org.access.log tpass_main;
    error_log /var/log/nginx/file.tschoolsu.org.error.log;
    client_max_body_size 110m;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The real_ip module retains the original network peer in $realip_remote_addr.
    # Reject direct connections, including forged CF-Connecting-IP headers.
    if ($tfiles_cloudflare_peer = 0) { return 403; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tfiles-acme;
        default_type text/plain;
    }

    location ^~ /api/auth/ {
        client_max_body_size 8k;
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }

    location = /api/selection {
        client_max_body_size 80k;
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name file.tschoolsu.org;

    ssl_certificate /etc/letsencrypt/live/file.tschoolsu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/file.tschoolsu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tfilesSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/file.tschoolsu.org.https.access.log tpass_main;
    error_log /var/log/nginx/file.tschoolsu.org.error.log;
    client_max_body_size 110m;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($tfiles_cloudflare_peer = 0) { return 403; }

    location ^~ /api/auth/ {
        client_max_body_size 8k;
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }

    location = /api/selection {
        client_max_body_size 80k;
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/tfiles-proxy.conf;
    }
}
